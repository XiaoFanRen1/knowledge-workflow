name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.2'
          architecture: x64
      - name: Record the actual host
        shell: pwsh
        run: |
          python --version
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber
      - name: Prepare exact dependency artifacts
        shell: pwsh
        run: |
          python -m pip install -r requirements/build.in
          python tools/prepare_wheelhouse.py --wheelhouse wheelhouse
          python tools/verify_wheelhouse.py --wheelhouse wheelhouse
      - name: Install the frozen runtime
        shell: pwsh
        run: |
          python -m pip install --no-index --find-links wheelhouse --require-hashes -r requirements/windows-cp314.lock.txt
          python -m pip check
      - name: Verify public source and isolated behavior
        shell: pwsh
        run: |
          python -I -B -X utf8 tools/audit_public.py --history
          python -I -B -X utf8 tests/run.py
      - name: Install the pinned public model
        shell: pwsh
        run: python -I -B -X utf8 tools/setup_test_model.py --destination models
      - name: Verify real semantic MCP and disconnected maintenance
        shell: pwsh
        run: |
          python -I -B -X utf8 tools/semantic_smoke.py --model-dir models --output evidence/semantic.json
          python -I -B -X utf8 tools/test_long_maintenance.py --model-dir models --output evidence/long-maintenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-verification
          path: evidence/*.json
          if-no-files-found: ignore
