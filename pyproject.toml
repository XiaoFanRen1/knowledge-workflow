[build-system]
requires = ["setuptools==80.10.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-workflow"
version = "0.1.0rc7"
description = "Project-neutral engineering workflow with a private local knowledge lifecycle"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "PyYAML==6.0.3", "jieba==0.42.1", "setuptools==80.10.2", "pypdf==6.10.2",
  "mcp==1.27.0", "sentence-transformers==5.2.2", "transformers==5.0.0",
  "torch==2.10.0", "numpy==2.3.5", "huggingface-hub==1.3.5", "psutil==5.9.6"
]

[project.scripts]
kw = "knowledge_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_workflow = ["assets/*.json"]
